name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Unit tests (coder, gradients, theory bounds)
        run: python -m pytest tests -q

      - name: Round trip a real file through the CLI
        run: |
          head -c 24000 corpora/english.txt > sample.txt
          python neuralzip.py compress sample.txt sample.nz --model nz
          python neuralzip.py info sample.nz
          python neuralzip.py decompress sample.nz restored.txt
          cmp sample.txt restored.txt

      - name: The archive must actually be smaller than gzip -9
        run: |
          python - <<'PY'
          import pathlib, zlib
          data = pathlib.Path("sample.txt").read_bytes()
          nz = pathlib.Path("sample.nz").stat().st_size
          gz = len(zlib.compress(data, 9))
          print(f"nz {nz} bytes, gzip -9 {gz} bytes")
          assert nz < gz, "neuralzip archive is no smaller than gzip -9"
          PY
